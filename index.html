<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSI-Explorer | Portal Inkuiri IPS</title>
<meta name="description" content="SSI-Explorer - Portal Inkuiri Isu Sosiosaintifik untuk pembelajaran IPS.">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/png" href="https://github.com/suparji-tech.png">
<style>
:root{--navy:#0f172a;--blue:#1d4ed8}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#0f172a}
.app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#fff;overflow:hidden}
.frame{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;margin:0;padding:0;background:#fff}
.loading{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f8fafc;color:#334155;transition:opacity .22s ease,visibility .22s ease}
.loading.done{opacity:0;visibility:hidden;pointer-events:none}
.spinner{width:40px;height:40px;border:4px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:spin .75s linear infinite}
.loading p{font-size:14px;margin:0}.loading small{font-size:12px;color:#64748b}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}.loading{transition:none}}
</style>
</head>
<body>
<main class="app" aria-label="SSI-Explorer">
  <div class="loading" id="loading" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loadingText">Memuat SSI-Explorer…</p>
    <small>Mohon tunggu, aplikasi sedang dibuka.</small>
  </div>
  <iframe class="frame" id="appFrame" title="SSI-Explorer — Portal Inkuiri IPS"
    src="https://script.google.com/a/macros/admin.smp.belajar.id/s/AKfycbyS8MaGDOFMkJxMaCJmw0dO9GWwOc3F56y4w1X9mnfNRK8rLp6nRZHK0rgkunglq8kCFA/exec"
    allow="fullscreen" allowfullscreen loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</main>
<script>
(() => {
  const frame=document.getElementById('appFrame');
  const loading=document.getElementById('loading');
  const loadingText=document.getElementById('loadingText');
  let loaded=false;
  function finishLoading(){
    if(loaded)return;
    loaded=true;
    loading.classList.add('done');
  }
  frame.addEventListener('load',()=>{
    loadingText.textContent='Aplikasi diterima, menyiapkan tampilan…';
    window.setTimeout(finishLoading,350);
  });
  frame.addEventListener('error',()=>{
    loadingText.textContent='Aplikasi tidak dapat dimuat di dalam bingkai.';
    loading.classList.add('done');
  });
  window.setTimeout(()=>{
    if(!loaded){
      loadingText.textContent='Aplikasi belum merespons. Anda dapat membukanya langsung.';
      loading.classList.add('done');
    }
  },15000);
})();
</script>
</body>
</html>
